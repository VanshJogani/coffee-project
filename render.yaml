services:
  - type: web
    name: coffee-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: cron
    name: coffee-scraper
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    schedule: "0 6 * * *"
    startCommand: python -m pipeline.runner
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
