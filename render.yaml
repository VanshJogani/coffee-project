services:
  - type: web
    name: coffee-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend-py
    buildCommand: pip install -r requirements.txt && pip install libsql-experimental
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: cron
    name: coffee-scraper
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    schedule: "0 6 * * *"
    startCommand: python -m pipeline.runner
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
