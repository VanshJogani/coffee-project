services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - ./backend/coffee.db:/app/coffee.db
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "5173:4173"
